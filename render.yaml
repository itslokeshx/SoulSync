services:
  - type: web
    name: soulsync-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JIOSAAVN_API
        value: https://jiosavan-api2.vercel.app/api
      - key: BACKEND_URL
        value: https://soulsync-backend-a5fs.onrender.com
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: soulsync-backend
          property: host

  - type: web
    name: soulsync-music-provider
    runtime: python
    rootDir: backend/services/music-provider
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 4002
    envVars:
      - key: YTMUSIC_AUTH_TYPE
        value: guest
    healthCheckPath: /health

