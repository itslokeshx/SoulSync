services:
  - type: web
    name: soulsync-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://soulsync-backend-a5fs.onrender.com
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: soulsync-backend
          property: host
      - key: MUSIC_PROVIDER_URL
        value: http://soulsync-music-provider:4002

  - type: web
    name: soulsync-music-provider
    runtime: python
    rootDir: backend/services/music-provider
    buildCommand: curl -fsSL https://deno.land/install.sh | sh && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 4002
    envVars:
      - key: YTMUSIC_AUTH_TYPE
        value: guest
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /health

